name: finbook

# Dev-mode override for the web service: runs Vite's dev server with the
# host source mounted in, instead of the Dockerfile's static nginx build.
# Auto-merged by `docker compose` whenever docker-compose.yml is present.
services:
  web:
    image: node:20-alpine
    container_name: finbook-web
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    environment:
      VITE_API_TARGET: http://api:4000
    volumes:
      - ./web:/app
      - web_node_modules:/app/node_modules
    ports: !override
      - "8080:5173"
    depends_on:
      - api
    build: !reset null

volumes:
  web_node_modules:
