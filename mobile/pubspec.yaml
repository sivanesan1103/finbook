name: finbook
description: FinBook — Khatabook-inspired business ledger (Flutter client for the shared Node.js API)
publish_to: "none"
version: 1.0.0+2

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  provider: ^6.1.2
  shared_preferences: ^2.2.3
  intl: ^0.19.0
  path_provider: ^2.1.3
  share_plus: ^10.0.0
  file_picker: ^8.0.0+1

dev_dependencies:
  flutter_lints: ^4.0.0
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
