server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Re-resolve the api hostname via Docker DNS instead of caching the IP
    # at startup — otherwise a restarted api container causes 502s.
    resolver 127.0.0.11 valid=10s;
    set $backend http://api:4000;

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API + uploads to the backend container
    location /api {
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location /uploads {
        proxy_pass $backend;
    }
}
