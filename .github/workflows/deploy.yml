name: Deploy to production

# Runs on a self-hosted runner installed directly on the production host —
# the Pi sits behind Tailscale, so a GitHub-hosted cloud runner has no route
# to it. Moving to a new server later means installing a runner there (see
# README "Maintenance directions") and swapping DEPLOY_PATH; the deploy
# steps themselves don't change.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, rpi]
    env:
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
    steps:
      - uses: actions/checkout@v4

      # docker-compose.yml at DEPLOY_PATH holds production secrets and is
      # never touched — only app source under web/ and backend/ is synced
      # from the runner's checkout, then those two services are rebuilt.
      - name: Sync source to deploy path
        run: |
          rsync -a --delete --exclude node_modules --exclude dist --exclude .env \
            web/ "$DEPLOY_PATH/web/"
          rsync -a --delete --exclude node_modules --exclude .env \
            backend/ "$DEPLOY_PATH/backend/"

      - name: Rebuild and restart services
        run: |
          cd "$DEPLOY_PATH"
          docker compose build api web
          docker compose up -d api web

      - name: Health check
        run: |
          sleep 5
          curl -sf -o /dev/null -w "web  HTTP %{http_code}\n" http://localhost:8080/
          curl -s  -o /dev/null -w "api  HTTP %{http_code}\n" http://localhost:4000/
