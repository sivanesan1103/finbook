# ─────────────────────────────────────────────────────────────────────────
# FinBook — PRODUCTION compose for the AWS server (Tailscale 100.99.22.48).
#
# This is the file that lives at DEPLOY_PATH on the server. The GitHub Actions
# deploy rsyncs web/, backend/, backup-tool/ source onto the box and runs
# `docker compose build/up` against THIS file — it is never overwritten by the
# deploy, so all real secrets live here (in the sibling .env), not in git.
#
# Every secret is read from .env (see deploy/.env.production.example). Nothing
# is published to 0.0.0.0: the app is reachable only through the Cloudflare
# Tunnel (cloudflared below), which dials OUT to Cloudflare — no inbound ports,
# no security-group holes. App ports are bound to 127.0.0.1 only so the
# self-hosted runner's health check can still curl them locally.
# ─────────────────────────────────────────────────────────────────────────
name: finbook

services:
  db:
    image: mysql:8.4
    container_name: finbook-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    # Localhost only — never expose the database off the box.
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      # Memory tuning for the t3.micro's 908MB ceiling — see the file for
      # what/why. Delete this mount (and the file) if you move to a bigger
      # instance and want MySQL's normal defaults back.
      - ./mysql-conf.d:/etc/mysql/conf.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: ./backend
    container_name: finbook-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: mysql://${MYSQL_USER}:${MYSQL_PASSWORD}@db:3306/${MYSQL_DATABASE}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      SHARE_TOKEN_SECRET: ${SHARE_TOKEN_SECRET}
      FILE_URL_SECRET: ${FILE_URL_SECRET}
      PUBLIC_WEB_URL: ${PUBLIC_WEB_URL}
      CORS_ORIGINS: ${CORS_ORIGINS}
      # SEED_ON_BOOT is deliberately absent — the demo owner login must never
      # be seeded in production.
    ports:
      - "127.0.0.1:4000:4000"
    volumes:
      - api_uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./web
    container_name: finbook-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      - api

  # Service name MUST be "backup-tool" — the GitHub Actions deploy runs
  # `docker compose build/up ... backup-tool`.
  backup-tool:
    build: ./backup-tool
    container_name: finbook-backup
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: ${MYSQL_DATABASE}
      DB_USER: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      BACKUP_DIR: /backups
      UPLOADS_DIR: /app/uploads
      CRON_SCHEDULE: "0 2 * * *"
      RETENTION_DAYS: "7"
      TRASH_RETENTION_DAYS: "14"
      UPLOADS_RETENTION_DAYS: "7"
      BACKUP_TOOL_USER: ${BACKUP_TOOL_USER}
      BACKUP_TOOL_PASS: ${BACKUP_TOOL_PASS}
    ports:
      - "127.0.0.1:4100:4100"
    volumes:
      # Host bind-mount so backups survive `docker compose down -v` and are
      # easy to copy off the box / sync to cloud storage.
      - ./backups:/backups
      - api_uploads:/app/uploads:ro
    depends_on:
      db:
        condition: service_healthy

  # ── Cloudflare Tunnel: the only ingress. Create a tunnel in the Cloudflare
  #    dashboard, route finbook.online → http://web:80, api.finbook.online →
  #    http://api:4000, then paste the tunnel token into .env as
  #    CLOUDFLARE_TUNNEL_TOKEN. Grafana has no public route — it isn't
  #    reachable through the tunnel at all; it's viewed locally over
  #    Tailscale (see the loki service below). Remove this service if you
  #    run cloudflared as a host systemd service instead. ──
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: finbook-cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - web
      - api

  # Tiny (~15MB) host-metrics exporter — CPU/mem/disk/network. network_mode
  # host means it binds directly to a host interface with NO docker port
  # mapping to control it, so --web.listen-address explicitly restricts it
  # to the Tailscale IP the same way the ${TAILSCALE_IP}-bound ports do
  # elsewhere in this file — never the public interface, regardless of the
  # AWS security group. Scraped remotely by Prometheus on a dev machine;
  # see DEPLOY-AWS.md step 8.
  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: finbook-node-exporter
    restart: unless-stopped
    command:
      - '--path.rootfs=/host'
      - '--collector.filesystem.mount-points-exclude=^/(dev|proc|sys|var/lib/docker/.+|var/lib/containerd/.+)($$|/)'
      - '--web.listen-address=${TAILSCALE_IP}:9100'
    network_mode: host
    pid: host
    volumes:
      - /:/host:ro,rslave

  # Bound to the box's Tailscale IP only (not 127.0.0.1, not 0.0.0.0) so it's
  # reachable from Grafana running on a dev machine over the tailnet, but
  # never from the public internet regardless of the AWS security group.
  # Grafana itself doesn't run on this box — see DEPLOY-AWS.md step 8 for
  # running it on the operator's own machine instead. Rationale: t3.micro
  # (908MB RAM) is already tight
  # running the app + Loki + Promtail; Grafana was the single heaviest
  # optional piece, so it moved off-box entirely.
  loki:
    image: grafana/loki:2.9.8
    container_name: finbook-loki
    restart: unless-stopped
    command: -config.file=/etc/loki/local-config.yaml
    ports:
      - "${TAILSCALE_IP}:3100:3100"
    volumes:
      - ./observability/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki

  # NOTE: must stay >= 3.0 — 2.9.x's bundled Docker client only speaks API
  # 1.42 and silently fails to discover any containers ("client version 1.42
  # is too old") against modern Docker daemons (this box negotiates a
  # minimum of 1.44), which means container log scraping never actually
  # worked with 2.9.x. Setting DOCKER_API_VERSION as an env var does NOT fix
  # this on 2.9.x — the docker_sd discovery code ignores it. 3.1.0's client
  # negotiates correctly out of the box. Loki's push API is stable across
  # this version gap, so loki itself doesn't need to move in lockstep.
  promtail:
    image: grafana/promtail:3.1.0
    container_name: finbook-promtail
    restart: unless-stopped
    user: "0:0"
    command: -config.file=/etc/promtail/config.yml
    volumes:
      - ./observability/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/log/journal:/var/log/journal:ro
      - /etc/machine-id:/etc/machine-id:ro
      - promtail_positions:/positions
    depends_on:
      - loki

volumes:
  db_data:
  api_uploads:
  loki_data:
  promtail_positions:
